name: cesizen-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      APP_SECRET: change-me-in-docker
      DATABASE_URL: mysql://cesizen:cesizen@database:3306/cesizen?serverVersion=mariadb-11.4.2&charset=utf8mb4
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: cesizen
      DB_USER: cesizen
      DB_PASSWORD: cesizen
      JWT_SECRET: docker-jwt-secret
      JWT_TTL: 3600
      REFRESH_TOKEN_TTL: 2592000
    ports:
      - "8000:80"
    restart: unless-stopped

  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: cesizen
      MARIADB_USER: cesizen
      MARIADB_PASSWORD: cesizen
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped


volumes:
  mariadb_data:
