name: cesizen

services:
  app:
    image: ghcr.io/loic-1/cesizen-app:latest
    ports:
      - "5173:5173"
    volumes:
      - ./cesizen-app:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped

  # Lance le conteneur d'API Symfony
  api:
    image: ghcr.io/loic-1/cesizen-api:latest
    depends_on:
      database:
        condition: service_healthy
      # mailpit:
      #   condition: service_started
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL}
      MAILER_FROM_EMAIL: ${MAILER_FROM_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
    ports:
      - "8000:80"
    restart: unless-stopped
