name: Publication of App and API Dockeerfiles

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Docker BuildX
        uses: docker/setup-buildx-action@v4

      - name: Login to container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./cesizen-api
          file: ./cesizen-api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/loic-1/cesizen-api-api:latest

      - name: Build & push API (dev)
        if: github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v7
        with:
          context: ./cesizen-api
          file: ./cesizen-api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/loic-1/cesizen-api-api:dev

      - name: Build & push App Dockerfile to registry (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./cesizen-app
          file: ./cesizen-app/Dockerfile
          push: true
          tags: |
            ghcr.io/loic-1/cesizen-api-app:latest

      - name: Build & push App Dockerfile to registry (dev)
        if: github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v7
        with:
          context: ./cesizen-app
          file: ./cesizen-app/Dockerfile
          push: true
          tags: |
            ghcr.io/loic-1/cesizen-api-app:dev
