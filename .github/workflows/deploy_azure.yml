name: Deploy to Azure VM

on:
  workflow_run:
    workflows: ["Publication of App and API Dockerfiles"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v6

      - name: copy docker compose to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          password: ${{ secrets.VM_PASSWORD }}
          port: ${{ secrets.VM_PORT || 22 }}
          source: "compose.base.yaml,compose.prod.yaml"
          target: "/home/${{ secrets.VM_USERNAME }}/"

      - name: execute docker compose
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          password: ${{ secrets.VM_PASSWORD }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            docker compose -f ./compose.base.yaml -f ./compose.prod.yaml pull
            docker compose -f ./compose.base.yaml -f ./compose.prod.yaml up -d --remove-orphans
